<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f1ea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>OBS Monitor · 手机遥控</title>
  <style>
    :root{color-scheme:light;--bg:#f5f1ea;--panel:#fffdf9;--panel-alt:#faf6ef;--line:#e3dcd0;--line-strong:#cfc5b4;--muted:#7c7268;--text:#1f1b18;--text-sec:#4a433d;--primary:#d95a36;--on-primary:#ffffff;--primary-soft:#fcece6;--red:#c43d3d;--red-bg:#fbecec;--accent:#2e6f95;--subtle:#eae4d9;--soft:#e6f0f6;--warning:#a86411;--warning-bg:#fbf1df;--notice-bg:#fbecec;--card-shadow:0 2px 12px #1f1b180a;--btn-shadow:0 1px 4px #1f1b1808;--primary-ico:#ffffff33}
    :root[data-theme="dark"]{color-scheme:dark;--bg:#161514;--panel:#161514;--panel-alt:#100f0e;--line:#33302c;--line-strong:#4a4640;--muted:#9a958e;--text:#f3efe8;--text-sec:#cbc5bc;--primary:#f07a52;--on-primary:#1f0d06;--primary-soft:#3a241b;--red:#ff4f6a;--red-bg:#3d1a20;--accent:#7ab3e0;--subtle:#24221f;--soft:#1c2a36;--warning:#f0bc5e;--warning-bg:#3a2e19;--notice-bg:#3d1a20;--card-shadow:none;--btn-shadow:none;--primary-ico:#0000001f}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}
    button,input{font:inherit}button{touch-action:manipulation;cursor:pointer}button:disabled{cursor:default}
    button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    main{max-width:440px;margin:auto;padding:16px 16px calc(22px + env(safe-area-inset-bottom))}

    /* Compact integrated top bar */
    .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .logo{width:34px;height:34px;flex-shrink:0;border-radius:10px;background:var(--primary);display:grid;place-items:center}
    .logo:before{content:"";height:11px;width:11px;border-radius:50%;background:var(--on-primary)}
    .brand b{display:block;font-size:15px;letter-spacing:-.3px;font-weight:700;line-height:1.15}
    .brand small{display:block;font-size:10px;letter-spacing:.4px;color:var(--muted);margin-top:2px}
    .top-right{display:flex;align-items:center;gap:7px;flex-shrink:0}
    .badge{font-size:11px;font-weight:600;display:flex;align-items:center;gap:5px;color:var(--muted);background:var(--subtle);padding:5px 10px;border-radius:99px;white-space:nowrap}
    .dot{display:inline-block;flex-shrink:0;height:6px;width:6px;border-radius:50%;background:currentColor}
    .badge.online{color:var(--accent);background:var(--soft)}
    .theme-button{appearance:none;border:1px solid var(--line);color:var(--text-sec);background:var(--panel);border-radius:99px;padding:5px 11px;font-size:11px;font-weight:600;line-height:1.4;min-height:30px}

    /* Alert, pairing & reconnect cards */
    .notice{display:none;background:var(--notice-bg);color:var(--red);border:1px solid var(--line);padding:11px 14px;font-size:12px;line-height:1.6;border-radius:14px;margin-bottom:12px;overflow-wrap:anywhere}.notice.show{display:block}
    .pairing{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:16px;margin-bottom:14px;font-size:13px}
    .pairing b{font-size:14px}.pairing p{font-size:12px;color:var(--muted);line-height:1.7;margin:6px 0 12px}
    .pairing input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel-alt);color:var(--text);font-size:15px;margin-bottom:10px}
    .pairing .theme-button{color:var(--on-primary);background:var(--primary);border-color:var(--primary);border-radius:11px;min-height:42px;width:100%}
    .reconnect{width:100%;margin-bottom:14px;border-radius:12px;min-height:40px;color:var(--text);background:var(--panel);border-color:var(--line-strong)}
    .pairing[hidden],.reconnect[hidden]{display:none}

    /* Elevated dashboard hero card */
    .hero{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px 16px 15px;margin-bottom:14px;box-shadow:var(--card-shadow)}
    .hero:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--primary)}.hero.live:before{background:var(--red)}.hero.paused:before{background:var(--warning)}
    .hero-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .state{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:7px;color:var(--muted);background:var(--subtle);padding:5px 11px;border-radius:99px}
    .live .state{color:var(--red);background:var(--red-bg)}.paused .state{color:var(--warning);background:var(--warning-bg)}
    .live .state .dot{animation:pulse 1.8s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.82)}}
    .caps{font-size:10px;letter-spacing:1.4px;color:var(--muted);font-weight:600}
    .clock-wrap{padding:16px 2px 14px}
    .clock{font-variant-numeric:tabular-nums;font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:clamp(36px,12.2vw,48px);font-weight:400;letter-spacing:-1.8px;line-height:1.1;white-space:nowrap}
    .clock-label{font-size:11px;color:var(--muted);margin-top:4px}

    /* Inset metrics block inside hero */
    .metric-card{background:var(--panel-alt);border:1px solid var(--line);border-radius:14px;padding:13px 14px 12px}
    .size-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .label{font-size:11px;color:var(--muted)}
    .size{font-size:26px;letter-spacing:-.7px;font-variant-numeric:tabular-nums;margin-top:2px;font-weight:700;line-height:1.2}
    .limit{font-size:10px;font-weight:600;color:var(--muted);padding:3px 8px;border-radius:99px;background:var(--panel);border:1px solid var(--line);text-align:right;max-width:50%;white-space:nowrap}
    .exact{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:4px;overflow-wrap:anywhere}
    .track{height:5px;overflow:hidden;background:var(--subtle);border-radius:99px;margin:11px 0 7px}
    .fill{height:100%;width:0;background:var(--accent);border-radius:99px}
    .hint{font-size:10px;line-height:1.55;color:var(--muted);overflow-wrap:anywhere}

    /* Tactile 2x2 hardware-inspired control grid */
    .section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 2px 9px}
    .section-head b{font-size:13px;font-weight:700;letter-spacing:-.2px}.section-head span{font-size:11px;color:var(--muted)}
    .actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-bottom:14px}
    .action{appearance:none;-webkit-appearance:none;display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);padding:14px;min-height:74px;text-align:left;box-shadow:var(--btn-shadow)}
    .action:active:enabled{transform:scale(.975)}
    .action .icon{display:grid;place-items:center;width:34px;height:34px;flex-shrink:0;border-radius:11px;background:var(--panel-alt);border:1px solid var(--line)}
    .icon svg{width:15px;height:15px;fill:currentColor}
    .action .meta{min-width:0;display:flex;flex-direction:column;gap:2px}
    .action b{font-size:14px;font-weight:700;white-space:nowrap;line-height:1.2}
    .action small{font-size:9px;letter-spacing:1.1px;opacity:.68;font-weight:600}
    .action.primary[data-available="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
    .action.primary[data-available="true"] .icon{background:var(--primary-ico);border-color:transparent}
    .action.pause[data-available="true"]{background:var(--panel);border-color:var(--warning);color:var(--warning)}
    .action.pause[data-available="true"] .icon{background:var(--warning-bg);border-color:transparent}
    .action.resume[data-available="true"]{background:var(--soft);border-color:var(--accent);color:var(--accent)}
    .action.resume[data-available="true"] .icon{background:var(--panel);border-color:transparent}
    .action.stop[data-available="true"]{background:var(--panel);border-color:var(--red);color:var(--red)}
    .action.stop[data-available="true"] .icon{background:var(--red-bg);border-color:transparent}
    .action:disabled{opacity:1;background:var(--subtle);border-color:var(--line);color:var(--muted);box-shadow:none}
    .action:disabled .icon{opacity:.5;background:transparent;border-color:var(--line)}

    /* Combined bottom settings & device card (neutral switch so coral/red stay semantic) */
    .panel-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
    .sound{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px}
    .sound b{font-size:13px;font-weight:600;display:block}.sound p{font-size:11px;color:var(--muted);margin:2px 0 0}
    .switch{position:relative;display:block;flex-shrink:0;width:42px;height:24px}
    .switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;z-index:2;cursor:pointer}
    .switch span{position:absolute;inset:0;background:var(--line-strong);border-radius:99px}
    .switch span:after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:var(--panel);box-shadow:0 1px 2px #00000026;transition:transform .2s}
    .switch input:checked+span{background:var(--text-sec)}
    .switch input:checked+span:after{transform:translateX(18px);background:var(--bg)}
    .switch input:disabled+span{opacity:.42}
    .switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
    .card-sep{height:1px;background:var(--line);margin:0 16px}
    .pairing-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px;font-size:11px;color:var(--muted)}
    .pairing-footer button{flex-shrink:0;border-radius:8px;padding:4px 10px;min-height:28px;font-size:11px;background:var(--panel-alt);border-color:var(--line);color:var(--text-sec)}
    .pairing-footer button:disabled{opacity:.45}

    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .foot{font-size:10px;text-align:center;line-height:1.8;color:var(--muted);margin:14px 0 0}
    .toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,8px);max-width:90vw;background:var(--text);color:var(--bg);box-shadow:0 8px 28px #0000002c;border-radius:99px;padding:10px 18px;font-size:12px;font-weight:500;opacity:0;transition:.2s;pointer-events:none;z-index:10}
    .toast.show{opacity:1;transform:translate(-50%,0)}

    body,.hero,.metric-card,.panel-card,.badge,.state,.label,.size,.limit,.exact,.hint,.clock-label,.section-head,.section-head span,.sound,.sound p,.pairing,.pairing p,.pairing input,.pairing-footer,.foot,.theme-button,.brand small,.caps,.notice,.card-sep,.track,.switch span,.logo{transition:background-color .24s ease-in-out,color .24s ease-in-out,border-color .24s ease-in-out,box-shadow .24s ease-in-out}
    .action{transition:transform .12s,background-color .24s ease-in-out,color .24s ease-in-out,border-color .24s ease-in-out}
    .fill{transition:width .35s,background-color .24s ease-in-out}
    @media(max-width:360px){main{padding:14px 12px}.top{gap:6px}.brand{gap:7px}.logo{width:30px;height:30px;border-radius:9px}.brand b{font-size:14px}.top-right{gap:5px}.badge{font-size:10px;padding:4px 7px}.theme-button{font-size:10px;padding:4px 8px;min-height:28px}.hero{padding:14px}.action{padding:11px;gap:9px;min-height:68px}.action .icon{width:30px;height:30px}.action b{font-size:13px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
  </style>
</head>
<body>
<main>
  <header class="top">
    <div class="brand"><div class="logo"></div><div><b>OBS Monitor</b><small>手机遥控台</small></div></div>
    <div class="top-right">
      <div id="connection" class="badge"><i class="dot"></i><span>正在连接</span></div>
      <button id="theme" class="theme-button" aria-label="切换浅色深色主题">☾ 深色</button>
    </div>
  </header>

  <div id="notice" class="notice" role="alert"></div>

  <section id="pairing" class="pairing" hidden aria-label="连接电脑">
    <b>连接你的电脑</b>
    <p>粘贴电脑工具中的完整控制链接，或扫描二维码。配对后可关闭浏览器，下次自动恢复。</p>
    <label class="sr-only" for="pairLink">电脑控制链接</label>
    <input id="pairLink" type="url" placeholder="http://电脑地址:8765/#token=…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="pairConnect" class="theme-button">连接电脑</button>
  </section>

  <button id="retry" class="theme-button reconnect" hidden>重新连接电脑</button>

  <section class="hero" id="hero" aria-label="录制状态">
    <div class="hero-top">
      <div class="state"><i class="dot"></i><span id="state">等待连接</span></div>
      <span class="caps">SESSION</span>
    </div>
    <div class="clock-wrap">
      <div id="clock" class="clock">00:00:00</div>
      <div id="clockLabel" class="clock-label">录制时长</div>
    </div>
    <div class="metric-card">
      <div class="size-row">
        <div>
          <div class="label">实时输出大小</div>
          <div id="size" class="size">—</div>
        </div>
        <div id="limit" class="limit"></div>
      </div>
      <div id="exactSize" class="exact">尚未收到 OBS 数据</div>
      <div class="track"><div id="fill" class="fill"></div></div>
      <div id="sizeHint" class="hint">从 OBS 直接读取，每 0.8 秒刷新</div>
    </div>
  </section>

  <div class="section-head"><b>录制控制</b><span id="commandState">与电脑状态同步</span></div>
  <div class="actions">
    <button class="action primary" data-action="start" disabled>
      <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg></span>
      <span class="meta"><b>开始录制</b><small>START</small></span>
    </button>
    <button class="action pause" data-action="pause" disabled>
      <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/></svg></span>
      <span class="meta"><b>暂停录制</b><small>PAUSE</small></span>
    </button>
    <button class="action resume" data-action="resume" disabled>
      <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3l15 9-15 9z"/></svg></span>
      <span class="meta"><b>继续录制</b><small>RESUME</small></span>
    </button>
    <button class="action stop" data-action="stop" disabled>
      <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></span>
      <span class="meta"><b>结束录制</b><small>STOP</small></span>
    </button>
  </div>

  <section class="panel-card" aria-label="提示音与设备配对">
    <div class="sound">
      <div><b>电脑操作提示音</b><p>开始 / 暂停 / 继续 / 结束时播放</p></div>
      <label class="switch"><input id="sound" type="checkbox" aria-label="电脑操作提示音" disabled><span></span></label>
    </div>
    <div class="card-sep"></div>
    <div class="pairing-footer">
      <span id="pairingStatus">连接后自动记住此浏览器</span>
      <button id="forget" class="theme-button" disabled>忘记此设备</button>
    </div>
  </section>

  <p class="foot">同一局域网连接 · 电脑工具保持运行 · OBS MONITOR v__APP_VERSION__</p>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
  const $ = id => document.getElementById(id);
  const readStorage = (name, key) => {try {return globalThis[name].getItem(key);} catch {return null;}};
  const writeStorage = (name, key, value) => {try {if (value === null) globalThis[name].removeItem(key); else globalThis[name].setItem(key, value);} catch {}};
  const now = () => performance.now();
  let theme = readStorage('localStorage', 'obs-theme') === 'dark' ? 'dark' : 'light';
  function applyTheme() {
    document.documentElement.dataset.theme = theme;
    $('theme').textContent = theme === 'dark' ? '☀ 浅色' : '☾ 深色';
    document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#161514' : '#f5f1ea';
  }
  applyTheme();
  $('theme').addEventListener('click', () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    writeStorage('localStorage', 'obs-theme', theme);
    applyTheme();
  });

  const parameters = new URLSearchParams(location.hash.slice(1));
  let token = parameters.get('token') || readStorage('localStorage', 'obs-token') || readStorage('sessionStorage', 'obs-token') || '';
  function rememberToken(value) {
    writeStorage('localStorage', 'obs-token', value || null);
    writeStorage('sessionStorage', 'obs-token', value || null);
  }
  if (token) {
    rememberToken(token);
  }
  // Keep a supplied fragment in browser history/bookmarks, including when storage
  // is blocked. It is never transmitted as part of the HTTP URL.
  let current = null, acceptedRevision = -1, acceptedInstance = '', receivedAt = 0, receivedWallAt = 0, lastLive = null;
  const retiredInstances = new Set();
  let pendingControl = false, soundBusy = false, pairingBusy = false, stopped = false, toastTimer;
  let pollTimer, statusFlight = null, statusGeneration = 0, pollFailures = 0;
  let controlFlight = null, soundFlight = null, pairingFlight = null;
  let pairingGeneration = 0;
  let latestControlBudget = 10000;

  function resetInFlight() {
    for (const flight of [controlFlight, soundFlight, pairingFlight]) {
      if (flight) flight.controller.abort();
    }
    controlFlight = soundFlight = pairingFlight = null;
    pendingControl = soundBusy = pairingBusy = false;
  }

  async function api(path, body, suppliedController) {
    const generation = pairingGeneration;
    const controller = suppliedController || new AbortController();
    const startedAt = now(), startedWall = Date.now();
    const initialControlBudget = latestControlBudget;
    let timeout;
    function armControlTimeout() {
      const budget = Math.max(initialControlBudget, latestControlBudget);
      const elapsed = Math.max(0, now() - startedAt, Date.now() - startedWall);
      if (elapsed >= budget) controller.abort();
      else timeout = setTimeout(armControlTimeout, Math.min(2147483647, budget - elapsed));
    }
    if (body !== undefined && path === '/api/control') armControlTimeout();
    else timeout = setTimeout(() => controller.abort(), body === undefined ? 4000 : 10000);
    try {
      const headers = token ? {'X-OBS-Token': token} : {};
      if (body !== undefined) headers['Content-Type'] = 'application/json';
      const response = await fetch(path, {
        method: body === undefined ? 'GET' : 'POST',
        headers,
        body: body === undefined ? undefined : JSON.stringify(body), signal: controller.signal, cache: 'no-store', credentials: 'same-origin'
      });
      let value = {};
      try {
        value = await response.json();
      } catch {
        if (response.ok) throw Object.assign(new Error('电脑返回的数据格式无效'), {localError: true});
      }
      if (generation !== pairingGeneration) throw Object.assign(new Error('配对状态已更新'), {obsolete:true});
      if (!response.ok) {
        const error = new Error(value.message || '操作失败');
        error.status = response.status;
        throw error;
      }
      return value;
    } catch (error) {
      if (generation !== pairingGeneration) error.obsolete = true;
      throw error;
    } finally {clearTimeout(timeout);}
  }
  function toast(message) {
    $('toast').textContent = message;
    $('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('toast').classList.remove('show'), 3500);
  }
  function notice(message = '') {
    $('notice').textContent = message;
    $('notice').classList.toggle('show', Boolean(message));
  }
  function expired() {
    return !current || !current.connected || current.stale ||
      !Number.isFinite(current.data_age_ms) || current.data_age_ms + Math.max(0, now() - receivedAt, Date.now() - receivedWallAt) > 3000;
  }
  function enableButtons() {
    document.querySelectorAll('[data-action]').forEach(button => {
      const available = Boolean(current && !expired() && !pendingControl && !pairingBusy && !current.busy && current.allowed[button.dataset.action]);
      button.disabled = !available;
      button.dataset.available = String(available);
      button.setAttribute('aria-disabled', String(!available));
    });
    $('commandState').textContent = pairingBusy ? '正在更新设备配对…' : pendingControl ? '正在等待 OBS 确认…' :
      current?.busy ? '电脑正在处理操作…' : expired() ? '等待最新状态' : '与电脑状态同步';
    $('forget').disabled = !current || pendingControl || soundBusy || pairingBusy;
  }
  function formatActionError(error, fallback) {
    if (error.name === 'AbortError') return '操作结果尚未确认，正在更新当前状态。';
    if (error.status || error.localError) return error.message || fallback;
    return fallback;
  }
  function updateView() {
    if (!current) {lastLive = false; enableButtons(); return;}
    $('pairing').hidden = true;
    $('retry').hidden = true;
    $('pairLink').value = '';
    $('pairConnect').disabled = false;
    $('pairConnect').textContent = '连接电脑';
    $('pairingStatus').textContent = '已配对 · 下次访问自动连接';
    const live = !expired();
    lastLive = live;
    $('connection').classList.toggle('online', live);
    $('connection').lastElementChild.textContent = live ? 'OBS 已连接' : current.connected ? '数据已过期' : 'OBS 未连接';
    $('state').textContent = live ? current.state_text : current.connected ? '数据已过期' : '未连接';
    $('clock').textContent = current.duration_text;
    $('clockLabel').textContent = !current.active && current.bytes > 0 ? '上次录制时长' : '录制时长';
    $('size').textContent = current.size_text;
    $('exactSize').textContent = current.size_exact_text + (live || current.data_age_ms === null ? '' : ' · 上次有效数据');
    $('hero').classList.toggle('live', live && current.active && !current.paused);
    $('hero').classList.toggle('paused', live && current.paused);
    const gb = Number((current.threshold_bytes / 1073741824).toFixed(1));
    $('limit').textContent = current.alert_enabled ? `提醒于 ${gb.toLocaleString()} GB` : '大小提醒已关闭';
    const percent = current.alert_enabled ? Math.min(100, current.bytes / Math.max(1, current.threshold_bytes) * 100) : 0;
    $('fill').style.width = percent + '%';
    const barColor = !live ? 'var(--muted)' : current.paused ? 'var(--warning)' : current.active ? 'var(--red)' : 'var(--accent)';
    $('fill').style.background = current.alert_enabled ? (percent >= 100 ? 'var(--red)' : barColor) : 'var(--muted)';
    $('sizeHint').textContent = !live ? '数据已过期，等待重新连接 OBS' : current.alerted ? '本次录制已触发大小提醒' :
      !current.active && current.bytes > 0 ? '上次录制数据 · 开始新录制后重置' : 'OBS 累计输出量，每 0.8 秒刷新';
    if (!soundBusy) $('sound').checked = current.sound_enabled;
    $('sound').disabled = soundBusy || pairingBusy;
    notice(current.message || (!live && current.connected ? '正在重新确认电脑状态…' : ''));
    enableButtons();
  }
  function render(state) {
    if (!state || !state.allowed || !Number.isSafeInteger(state.revision) || typeof state.instance_id !== 'string' || !state.instance_id) throw Object.assign(new Error('电脑返回的状态无效，请确认电脑工具和手机页面都已更新'), {localError: true});
    if (state.instance_id !== acceptedInstance) {
      if (retiredInstances.has(state.instance_id)) return false;
      if (acceptedInstance) retiredInstances.add(acceptedInstance);
      acceptedInstance = state.instance_id;
      acceptedRevision = -1;
    }
    if (state.revision < acceptedRevision) return false;
    acceptedRevision = state.revision;
    latestControlBudget = Number.isFinite(state.control_timeout_ms) ? Math.max(10000, state.control_timeout_ms + 3000) : 10000;
    current = state;
    receivedAt = now();
    receivedWallAt = Date.now();
    updateView();
    return true;
  }
  function offline(message) {
    current = null;
    lastLive = false;
    $('connection').classList.remove('online');
    $('connection').lastElementChild.textContent = '连接已断开';
    $('state').textContent = '状态已过期';
    $('hero').classList.remove('live', 'paused');
    $('sound').disabled = true;
    const hadSample = Boolean($('size').textContent && $('size').textContent !== '—');
    if (hadSample && !$('exactSize').textContent.endsWith(' · 上次有效数据')) $('exactSize').textContent += ' · 上次有效数据';
    $('sizeHint').textContent = hadSample ? '等待重新连接，当前显示上次有效数据' : '等待重新连接电脑';
    $('pairConnect').disabled = false;
    $('pairConnect').textContent = '连接电脑';
    $('retry').hidden = false;
    enableButtons();
    notice(message || '无法连接电脑，请检查 Wi-Fi 和电脑软件是否开启。');
  }
  function requirePairing(message) {
    pairingGeneration++;
    resetInFlight();
    cancelStatus();
    stopped = true;
    token = '';
    rememberToken('');
    history.replaceState(null, '', location.pathname);
    offline(message);
    $('pairing').hidden = false;
    $('retry').hidden = true;
    $('pairingStatus').textContent = '尚未配对';
    $('connection').lastElementChild.textContent = '尚未配对';
    $('state').textContent = '等待配对';
  }
  function cancelStatus() {
    clearTimeout(pollTimer);
    statusGeneration++;
    if (statusFlight) statusFlight.controller.abort();
    statusFlight = null;
  }
  async function poll(replace = false) {
    if (stopped || document.hidden) return;
    if (replace) cancelStatus();
    if (statusFlight) return statusFlight.promise;
    clearTimeout(pollTimer);
    const generation = ++statusGeneration, controller = new AbortController();
    const flight = {generation, controller};
    statusFlight = flight;
    flight.promise = (async () => {
      try {
        const state = await api('/api/status', undefined, controller);
        if (generation === statusGeneration) {render(state); pollFailures = 0;}
      } catch (error) {
        // Superseded responses and errors must never overwrite a later control result.
        if (generation !== statusGeneration || error.obsolete) return;
        pollFailures++;
        if (error.status === 401) requirePairing(error.message);
        else offline(error.name === 'AbortError' ? '连接超时，正在重试…' : error.status ? error.message : '暂时无法连接电脑，恢复网络后会自动重连。');
      } finally {
        if (generation === statusGeneration) {
          statusFlight = null;
          if (!stopped && !document.hidden) pollTimer = setTimeout(poll, Math.min(8000, 800 * 2 ** Math.max(0, pollFailures - 1)));
        }
      }
    })();
    return flight.promise;
  }

  document.querySelectorAll('[data-action]').forEach(button => button.addEventListener('click', async () => {
    const action = button.dataset.action;
    if (button.disabled || pendingControl || pairingBusy || !current || expired() || current.busy || !current.allowed[action]) return;
    const controller = new AbortController(), flight = {controller};
    controlFlight = flight;
    pendingControl = true;
    cancelStatus();
    enableButtons();
    // Keep the size, state and updated confirmation budget live while waiting.
    void poll();
    try {
      const result = await api('/api/control', {action}, controller);
      render(result.state);
      toast(result.message);
    } catch (error) {
      if (error.obsolete) return;
      if (error.status === 401) {requirePairing(error.message); return;}
      toast(formatActionError(error, '无法连接电脑，操作状态未知，正在重新确认。'));
    } finally {
      if (controlFlight === flight) {
        controlFlight = null;
        pendingControl = false;
        updateView();
        // Reconcile after every success, timeout and rejection; never retry a control request.
        if (!stopped) void poll(true);
      }
    }
  }));
  $('sound').addEventListener('change', async () => {
    if (soundBusy || pairingBusy || !current) return;
    const enabled = $('sound').checked;
    const controller = new AbortController(), flight = {controller};
    soundFlight = flight;
    soundBusy = true;
    $('sound').disabled = true;
    try {
      const result = await api('/api/sound', {enabled}, controller);
      render(result.state);
      toast(enabled ? '电脑提示音已开启' : '电脑提示音已关闭');
    } catch (error) {
      if (error.obsolete) return;
      if (error.status === 401) {requirePairing(error.message); return;}
      toast(formatActionError(error, '无法连接电脑，提示音设置未保存。'));
    } finally {
      if (soundFlight === flight) {
        soundFlight = null;
        soundBusy = false;
        if (current) updateView(); else $('sound').disabled = true;
        if (!stopped) void poll(true);
      }
    }
  });
  function resumePage() {
    updateView();
    if (document.hidden) cancelStatus();
    else if (!stopped) {pollFailures = 0; void poll(true);}
  }
  window.addEventListener('pageshow', resumePage);
  window.addEventListener('online', resumePage);
  window.addEventListener('pagehide', cancelStatus);
  document.addEventListener('visibilitychange', resumePage);
  $('retry').addEventListener('click', () => {stopped = false; pollFailures = 0; void poll(true);});
  function connectByLink() {
    try {
      let link;
      try {
        link = new URL($('pairLink').value.trim(), location.href);
      } catch {
        throw new Error('请输入电脑工具“复制链接”得到的完整地址。');
      }
      const nextToken = new URLSearchParams(link.hash.slice(1)).get('token');
      if (link.origin !== location.origin) throw new Error('链接地址与当前电脑不同，请直接打开粘贴的完整链接。');
      if (!nextToken || !/^[A-Za-z0-9_-]{32,128}$/.test(nextToken)) throw new Error('请输入电脑工具“复制链接”得到的完整地址。');
      notice('');
      $('pairConnect').disabled = true;
      $('pairConnect').textContent = '正在连接…';
      pairingGeneration++;
      resetInFlight();
      token = nextToken;
      rememberToken(token);
      history.replaceState(null, '', location.pathname + '#token=' + encodeURIComponent(token));
      stopped = false; pollFailures = 0; void poll(true);
    } catch (error) {
      $('pairConnect').disabled = false;
      $('pairConnect').textContent = '连接电脑';
      notice(error.message);
    }
  }
  $('pairConnect').addEventListener('click', connectByLink);
  $('pairLink').addEventListener('keydown', event => {if (event.key === 'Enter') connectByLink();});
  $('forget').addEventListener('click', async () => {
    if (pendingControl || soundBusy || pairingBusy || !current) return;
    const controller = new AbortController(), flight = {controller};
    pairingFlight = flight;
    pairingBusy = true;
    cancelStatus();
    updateView();
    try {
      await api('/api/unpair', {}, controller);
      cancelStatus();
      requirePairing('已忘记此设备。需要时可以使用电脑中的完整链接或扫码重新连接。');
    } catch (error) {
      if (error.obsolete) return;
      if (error.status === 401) requirePairing(error.message);
      else toast('未能解除配对，请恢复连接后重试。');
    } finally {
      if (pairingFlight === flight) {
        pairingFlight = null;
        pairingBusy = false;
        updateView();
        if (!stopped) void poll(true);
      }
    }
  });
  setInterval(() => {if (current && !document.hidden && lastLive !== !expired()) updateView();}, 500);
  // A persistent HttpOnly cookie can restore pairing even with no URL fragment
  // or readable browser storage. Only the server decides whether to ask to pair.
  void poll();
</script>
</body>
</html>
