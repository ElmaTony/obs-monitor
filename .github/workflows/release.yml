name: Build release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
            source_flag: ''
          - runner: windows-11-arm
            arch: arm64
            source_flag: '--no-source'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-build.txt
      - name: Prepare signed Inno Setup compiler
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'inno-setup.exe'
          $compiler = Join-Path $env:RUNNER_TEMP 'inno-compiler'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*Pyrsys*') { throw 'Inno Setup signature verification failed' }
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER',('/DIR=' + $compiler)) -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Inno Setup installation failed' }
          "OBS_ISCC=$compiler\ISCC.exe" >> $env:GITHUB_ENV
      - name: Validate version tag
        shell: pwsh
        run: |
          $version = python -c "from version import VERSION; print(VERSION)"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match version.py' }
      - name: Build and test native packages
        shell: pwsh
        run: python -B scripts/build_release.py --arch ${{ matrix.arch }} --iscc "$env:OBS_ISCC" ${{ matrix.source_flag }}
      - name: Smoke check packaged applications
        shell: pwsh
        run: python -B scripts/smoke_release.py --directory release --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: obs-monitor-windows-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
  draft:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: obs-monitor-windows-*
          path: release
          merge-multiple: true
      - name: Combine checksums
        working-directory: release
        run: sha256sum obs-monitor-*.exe obs-monitor-*.zip > SHA256SUMS.txt
      - name: Create reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --draft --title "OBS Monitor $RELEASE_TAG" --notes-file CHANGELOG.md
